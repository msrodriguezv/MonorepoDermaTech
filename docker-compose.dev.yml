version: '3.8'

services:
  # --- REDIS (Required by Auth) ---
  redis:
    image: redis:alpine
    container_name: dermatech_redis
    ports:
      - "6379:6379"
    networks:
      - dev_network

  # --- KAFKA & ZOOKEEPER (Required by BOTH) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dermatech_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - dev_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dermatech_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Perfect configuration to work with NX SERVE
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dev_network

  # --- MINIO (Required by Patient) ---
  minio:
    image: minio/minio:latest
    container_name: dermatech_minio
    ports:
      # NOTE: We map external port 9001 to internal 9000 (API)
      # This matches your .env AWS_ENDPOINT=http://localhost:9001
      - "9001:9000"
      - "9002:9001" # Console on 9002
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - dev_network

  # Script to create bucket automatically
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do echo 'Waiting...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing myminio/dermatech-avatars;
      /usr/bin/mc anonymous set public myminio/dermatech-avatars;
      exit 0;
      "
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge