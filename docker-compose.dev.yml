version: '3.8'

services:
  # =========================================
  # STORAGE LAYER (BASE DE DATOS)
  # =========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: dermatech_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dermatech_db
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # CACHE & COORDINATION LAYER
  # =========================================

  # --- REDIS ---
  redis:
    image: redis:alpine
    container_name: dermatech_redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes --requirepass "password"
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- ZOOKEEPER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dermatech_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Xmx256M -Xms256M"
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 200M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # MESSAGING & STREAMING LAYER
  # =========================================

  # --- KAFKA ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dermatech_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: "-Xmx400M -Xms400M"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    logging: *default-logging

  # --- RABBITMQ ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dermatech_rabbitmq
    ports:
      - "5672:5672"   # AMQP Port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- MOSQUITTO (MQTT) ---
  mosquitto:
    image: eclipse-mosquitto
    container_name: dermatech_mqtt
    ports:
      - "1883:1883" # MQTT Port
      - "9001:9001" # Websockets Port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging: *default-logging

  # =========================================
  # STORAGE & OBJECT LAYER
  # =========================================

  # --- MINIO ---
  minio:
    image: minio/minio:latest
    container_name: dermatech_minio
    ports:
      - "9000:9000"  # API Port (S3 Standard)
      - "9090:9001"  # Console Port (Mapped EXTERNAL 9090 to INTERNAL 9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging

  # --- MINIO BUCKET CREATION ---
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing myminio/dermatech-avatars;
      /usr/bin/mc anonymous set public myminio/dermatech-avatars;
      exit 0;
      "
    networks:
      - dev_network
    deploy:
      resources:
        limits:
          memory: 64M

  # =========================================
  # AI & AUTOMATION LAYER (AGREGADO)
  # =========================================

  # --- AI AGENT (PYTHON) ---
  ai-agent:
    build:
      context: ./apps/services/ai-agent
      dockerfile: Dockerfile
    container_name: dermatech_ai_agent
    ports:
      - "5000:5000"
    volumes:
      - ./apps/services/ai-agent:/app
    environment:
      - FLASK_ENV=development
    networks:
      - dev_network

  # --- n8n (WORKFLOW ORCHESTRATOR) ---
  n8n:
    image: n8nio/n8n:latest
    container_name: dermatech_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - GENERIC_TIMEZONE=America/Guayaquil
      - TZ=America/Guayaquil
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge

volumes:
  n8n_data: