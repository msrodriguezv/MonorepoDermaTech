version: '3.8'

services:
  # --- INFRAESTRUCTURA LOCAL (MinIO y Kafka se quedan) ---
  
  # ELIMINADO: postgres-core (Ahora usas Supabase)

  minio:
    image: minio/minio
    container_name: dermatech-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./infrastructure/local-data/minio:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: dermatech-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: dermatech-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- TU MICROSERVICIO ---
  patient-service:
    build:
      context: .
      dockerfile: apps/services/core/patient-service/Dockerfile
    container_name: dermatech-patient-service
    ports:
      - "3001:3001"
    depends_on:
      # YA NO ESPERAMOS A POSTGRES-CORE
      kafka:
        condition: service_started
    environment:
      # VARIABLES GENERALES
      NODE_ENV: production
      PORT: 3001
      
   
      # HOST: Este no cambia (depende de tu región, suele ser aws-0-us-east-1...)
      DB_HOST: aws-1-us-east-2.pooler.supabase.com
      
      # PUERTO: El pooler usa 6543
      DB_PORT: 5432
      
      # USUARIO: Aquí es donde estaba el error. Debe ser postgres + punto + tu ID
      DB_USER: postgres.umgypxpjonnerjaqvlcx
      
      # CONTRASEÑA: La que reseteaste hace un rato
      DB_PASSWORD: "DermaTechTesis2025"
      
      # NOMBRE BD: En Supabase es 'postgres' por defecto
      DB_NAME: postgres
      JWT_SECRET: secret
      
      # --- MINIO (LOCAL) ---
      # Seguimos usando MinIO localmente para archivos (o puedes cambiarlo a Supabase Storage también)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: root
      AWS_SECRET_ACCESS_KEY: password123
      AWS_BUCKET_NAME: patient-documents
      AWS_ENDPOINT: http://minio:9000
      
      # --- KAFKA (LOCAL) ---
      KAFKA_BROKERS: kafka:29092