version: '3.8'

services:
  # ----------------------------------------------------------------
  # INFRASTRUCTURE
  # ----------------------------------------------------------------
  
  
  redis_db:
    image: redis:alpine
    container_name: dermatech_redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - dermatech_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # MICROSERVICES
  # ----------------------------------------------------------------

  auth_service:
    container_name: dermatech_auth_service
    build:
      context: .
      dockerfile: apps/services/core/auth-service/Dockerfile
      args:
        PROJECT_NAME: auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    env_file:
      - .env
    depends_on:
      redis_db:
        condition: service_healthy
    networks:
      - dermatech_network

networks:
  dermatech_network:
    driver: bridge