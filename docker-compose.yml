version: '3.8'

services:
  
 minio:
    image: minio/minio
    container_name: dermatech-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER not set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD not set in .env}
    command: server /data --console-address ":9001"
    volumes:
      - ./infrastructure/local-data/minio:/data
zookeeper:
  image: confluentinc/cp-zookeeper:latest
  container_name: dermatech-zookeeper
  environment:
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: dermatech-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  patient-service:
    build:
      context: .
      dockerfile: apps/services/core/patient-service/Dockerfile
    container_name: dermatech-patient-service
    ports:
      - "3001:3001"
    depends_on:
      kafka:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      
      # --- CORRECCIÓN DE SEGURIDAD (FIX COPILOT) ---
      # Cambiamos los valores fijos por variables que leen tu .env
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      
      # Variables de seguridad y AWS
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_BUCKET_NAME: patient-documents
      AWS_ENDPOINT: http://minio:9000
      KAFKA_BROKERS: kafka:29092