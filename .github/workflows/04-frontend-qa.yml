name: "04. FRONTEND QA"

on:
  #push:
    #branches: [ developer ]
  workflow_dispatch:

env:
  PUBLIC_API_URL: "http://martharodriguez_qa2.distribuidauce.org"
  QA_BASTION_PUBLIC_IP: 100.52.22.97

jobs:
  # ============================================================================
  # 1. CHANGE DETECTION LOGIC
  # ============================================================================
  check-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/clients/**'

  # ============================================================================
  # 2. WEB BUILD & DOCKERIZATION
  # ============================================================================
  build-web:
    name: 🔨 Build & Push Web
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      
      - name: Build Flutter Web (QA)
        run: |
          cd apps/clients/mobile_app
          flutter pub get
          flutter build web --release --dart-define=API_URL=${{ env.PUBLIC_API_URL }}

      - name: Docker Registry Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: 'apps/clients/mobile_app/Dockerfile'
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/dermatech-frontend:latest
          build-args: SERVICE_PATH='frontend'

  # ============================================================================
  # 3. DEPLOYMENT (SAFE MODE)
  # ============================================================================
  deploy-frontend:
    name: 🚀 Deploy QA Web Server
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ip: 10.3.1.10
            node_name: node-a
          - ip: 10.4.1.10
            node_name: node-b
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      
      - name: Generate Docker Compose Manifest
        run: |
          cat > docker-compose-frontend.yml <<'EOF'
          version: '3.8'
          services:
            frontend:
              image: ${{ secrets.DOCKER_USERNAME }}/dermatech-frontend:latest
              restart: always
              ports: ["80:80"]
          EOF
          
      - name: Execute Deployment Relay
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # 1. Transfer Payload to Bastion (Jump Box)
          scp $SSH_OPTS -i ~/.ssh/id_rsa docker-compose-frontend.yml ec2-user@${{ env.QA_BASTION_PUBLIC_IP }}:/home/ec2-user/frontend-manifest.yml
          scp $SSH_OPTS -i ~/.ssh/id_rsa ~/.ssh/id_rsa ec2-user@${{ env.QA_BASTION_PUBLIC_IP }}:/home/ec2-user/deploy-key
          
          # 2. Execute Remote Commands via Bastion
          ssh $SSH_OPTS -i ~/.ssh/id_rsa ec2-user@${{ env.QA_BASTION_PUBLIC_IP }} << 'BASTION_EOF'
            chmod 600 /home/ec2-user/deploy-key
            
            # 3. Jump to Private Node
            scp $SSH_OPTS -i /home/ec2-user/deploy-key /home/ec2-user/frontend-manifest.yml ec2-user@${{ matrix.ip }}:/home/ec2-user/docker-compose-frontend.yml
            
            # 4. Pull and Restart Container
            ssh $SSH_OPTS -i /home/ec2-user/deploy-key ec2-user@${{ matrix.ip }} "
              echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
              
              sudo docker compose -f docker-compose-frontend.yml pull
              sudo docker compose -f docker-compose-frontend.yml up -d

              #  Secure Clean
              sudo docker image prune -f
            "
            # 5. Cleanup
            rm /home/ec2-user/deploy-key /home/ec2-user/frontend-manifest.yml
          BASTION_EOF