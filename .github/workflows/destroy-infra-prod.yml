name: "PROD: TURBO DESTROY Global Decommission"

on:
  #push:
    #branches: [ developer ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # STEP 0: BREAK ALL DEPENDENCIES (BRUTE FORCE - AWS CLI)
  # Cleans up locked resources and removes debris to prevent extra costs.
  # ============================================================================
  break-dependencies:
    name: Nuke PROD Resources (Force Cleanup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Restore Credentials (PROD)
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.PROD_AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      # 1. Terminate Instances
      - name: 🔥 Terminate All PROD Instances
        run: |
          echo "Scanning for instances in all PROD accounts..."
          for profile in prod-dermatech prod-events-dermatech prod-state-dermatech prod-node-a-dermatech prod-node-b-dermatech; do
            echo "  [Profile: $profile]"
            ids=$(aws ec2 describe-instances --profile $profile --region us-east-1 --filters "Name=instance-state-name,Values=running,stopped,stopping,pending" --query 'Reservations[*].Instances[*].InstanceId' --output text 2>/dev/null || echo "")
            for id in $ids; do
              echo "    ☠️ Killing Instance: $id"
              aws ec2 terminate-instances --profile $profile --region us-east-1 --instance-ids $id
            done
          done
          echo "⏳ Waiting 45s for instances to terminate..."
          sleep 45

      # 2. Delete Load Balancers (PROD Hub Only)
      - name: 🔥 Delete Load Balancers & Target Groups
        run: |
          echo "Scanning for Load Balancers in PROD Hub..."
          lb_arns=$(aws elbv2 describe-load-balancers --profile prod-dermatech --region us-east-1 --query 'LoadBalancers[*].LoadBalancerArn' --output text 2>/dev/null || echo "")
          for arn in $lb_arns; do
            echo "    ☠️ Deleting ALB: $arn"
            aws elbv2 delete-load-balancer --profile prod-dermatech --region us-east-1 --load-balancer-arn "$arn"
          done
          echo "⏳ Waiting 15s for Target Groups release..."
          sleep 15
          tg_arns=$(aws elbv2 describe-target-groups --profile prod-dermatech --region us-east-1 --query 'TargetGroups[*].TargetGroupArn' --output text 2>/dev/null || echo "")
          for arn in $tg_arns; do
            echo "    ☠️ Deleting TG: $arn"
            aws elbv2 delete-target-group --profile prod-dermatech --region us-east-1 --target-group-arn "$arn"
          done

      # 3. Delete VPC Peerings
      - name: 🔥 Delete VPC Peerings
        run: |
          for profile in prod-dermatech prod-events-dermatech prod-state-dermatech prod-node-a-dermatech prod-node-b-dermatech; do
            ids=$(aws ec2 describe-vpc-peering-connections --profile $profile --region us-east-1 --query 'VpcPeeringConnections[*].VpcPeeringConnectionId' --output text 2>/dev/null || echo "")
            for id in $ids; do
              echo "    ❌ Deleting Peering: $id ($profile)"
              aws ec2 delete-vpc-peering-connection --profile $profile --region us-east-1 --vpc-peering-connection-id $id || true
            done
          done

      # 4. Delete NAT & Internet Gateways
      - name: 🔥 Delete NAT & Internet Gateways
        run: |
          for profile in prod-dermatech prod-events-dermatech prod-state-dermatech prod-node-a-dermatech prod-node-b-dermatech; do
            # NATs
            nats=$(aws ec2 describe-nat-gateways --profile $profile --region us-east-1 --filter "Name=state,Values=available,pending" --query 'NatGateways[*].NatGatewayId' --output text 2>/dev/null || echo "")
            for id in $nats; do
              echo "    ❌ Deleting NAT: $id ($profile)"
              aws ec2 delete-nat-gateway --profile $profile --region us-east-1 --nat-gateway-id $id || true
            done
            # IGWs
            vpcs=$(aws ec2 describe-vpcs --profile $profile --region us-east-1 --query 'Vpcs[?!IsDefault].VpcId' --output text 2>/dev/null || echo "")
            for vpc in $vpcs; do
              igws=$(aws ec2 describe-internet-gateways --profile $profile --region us-east-1 --filters "Name=attachment.vpc-id,Values=$vpc" --query 'InternetGateways[*].InternetGatewayId' --output text 2>/dev/null || echo "")
              for igw in $igws; do
                echo "    ❌ Detaching/Deleting IGW: $igw ($profile)"
                aws ec2 detach-internet-gateway --profile $profile --region us-east-1 --internet-gateway-id $igw --vpc-id $vpc || true
                aws ec2 delete-internet-gateway --profile $profile --region us-east-1 --internet-gateway-id $igw || true
              done
            done
          done

      # 5. Delete ENIs, Subnets, SGs, VPCs
      - name: 🔥 Nuke Networking (ENIs, Subnets, SGs, VPCs)
        run: |
          echo "⏳ Waiting 30s to release ENIs..."
          sleep 30
          for profile in prod-dermatech prod-events-dermatech prod-state-dermatech prod-node-a-dermatech prod-node-b-dermatech; do
            # ENIs
            enis=$(aws ec2 describe-network-interfaces --profile $profile --region us-east-1 --filters "Name=status,Values=available" --query 'NetworkInterfaces[*].NetworkInterfaceId' --output text 2>/dev/null || echo "")
            for id in $enis; do aws ec2 delete-network-interface --profile $profile --region us-east-1 --network-interface-id $id || true; done
            
            # Subnets
            subs=$(aws ec2 describe-subnets --profile $profile --region us-east-1 --query 'Subnets[*].SubnetId' --output text 2>/dev/null || echo "")
            for id in $subs; do aws ec2 delete-subnet --profile $profile --region us-east-1 --subnet-id $id || true; done
            
            # Security Groups
            sgs=$(aws ec2 describe-security-groups --profile $profile --region us-east-1 --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || echo "")
            for i in {1..2}; do
              for id in $sgs; do aws ec2 delete-security-group --profile $profile --region us-east-1 --group-id $id 2>/dev/null || true; done
            done
            
            # VPCs
            vpcs=$(aws ec2 describe-vpcs --profile $profile --region us-east-1 --query 'Vpcs[?!IsDefault].VpcId' --output text 2>/dev/null || echo "")
            for id in $vpcs; do echo "    ☠️ Deleting VPC: $id"; aws ec2 delete-vpc --profile $profile --region us-east-1 --vpc-id $id || true; done
          done

      # ========================================================================
      # 6. SMART IP CLEANUP (PROTECTS BASTION - 100.50.124.78)
      # ========================================================================
      - name: 🧹 Smart Release of Unused IPs (PROD Profile Only)
        run: |
          # ---------------- CONFIGURATION ----------------
          PROTECTED_IP="100.50.124.78"
          PROFILE="prod-dermatech"
          # -----------------------------------------------
          
          echo "🛡️ PROTECTING CRITICAL IP: $PROTECTED_IP"
          echo "🔍 Scanning profile '$PROFILE' for unused Elastic IPs..."
          
          # Get IPs JSON
          ips_json=$(aws ec2 describe-addresses --profile $PROFILE --region us-east-1 --output json)
          
          # Loop through IPs
          echo "$ips_json" | jq -c '.Addresses[]' | while read i; do
            public_ip=$(echo $i | jq -r '.PublicIp')
            alloc_id=$(echo $i | jq -r '.AllocationId')
            association=$(echo $i | jq -r '.AssociationId')
            
            # LOGIC:
            # 1. If IP is the Protected Bastion IP -> DO NOT DELETE
            # 2. If IP is NOT Protected AND has NO Association -> DELETE
            # 3. Else -> SKIP
            
            if [ "$public_ip" == "$PROTECTED_IP" ]; then
              echo "  ✅ SAFETY LOCK ACTIVE: Skipping Protected IP $public_ip ($alloc_id)"
            elif [ "$association" == "null" ] || [ -z "$association" ]; then
              echo "  🗑️ RELEASING ORPHAN IP: $public_ip ($alloc_id)"
              aws ec2 release-address --profile $PROFILE --region us-east-1 --allocation-id $alloc_id
            else
              echo "  ⚠️ SKIPPING: IP $public_ip is still in use (Associated)"
            fi
          done

  # ============================================================================
  # STEP 1: VERIFICATION (AUDIT)
  # ============================================================================
  verify-cleanup:
    name: Verify Complete Cleanup
    needs: [break-dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Restore Credentials (PROD)
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.PROD_AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Audit Remaining Resources
        run: |
          echo "🔍 Auditing potential leftover resources..."
          for profile in prod-dermatech prod-events-dermatech prod-state-dermatech prod-node-a-dermatech prod-node-b-dermatech; do
            echo "------------------------------------------------"
            echo "Account Profile: $profile"
            vpc_count=$(aws ec2 describe-vpcs --profile $profile --region us-east-1 --query 'length(Vpcs[?!IsDefault])' 2>/dev/null || echo "0")
            echo "  Active Custom VPCs: $vpc_count"
            instance_count=$(aws ec2 describe-instances --profile $profile --region us-east-1 --filters "Name=instance-state-name,Values=running,stopped,pending" --query 'length(Reservations[*].Instances[*])' 2>/dev/null || echo "0")
            echo "  Active Instances:   $instance_count"
          done
          echo "------------------------------------------------"
          echo "✅ Audit Complete."