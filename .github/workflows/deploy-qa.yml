name: "QA: V2. TURBO DEPLOY DermaTech Global Infrastructure"

on:
  #push:
    #branches: [ qa ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  
  # ============================================================================
  # NETWORKING CONFIGURATION (QA ENVIRONMENT)
  # ============================================================================
  # Elastic IP associated with the Bastion Host (Preserved via Terraform)
  QA_BASTION_PUBLIC_IP: 100.52.22.97
  
  # Internal Private IPs for Application Nodes (STATIC ARCHITECTURE)
  EVENTS_PRIVATE_IP: 10.1.1.50
  STATE_PRIVATE_IP: 10.2.1.100
  NODE_A_PRIVATE_IP: 10.3.1.10
  NODE_B_PRIVATE_IP: 10.4.1.10

jobs:
  # ============================================================================
  # DIAGNOSTIC: BASTION CONNECTIVITY CHECK & AUTO-HEALING
  # ============================================================================
  
  test-bastion-connection:
    name: 🔍 Test Bastion SSH Connection
    runs-on: ubuntu-latest
    steps:
      # 1. Restore Credentials File (Fixes "Credentials could not be loaded" error)
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      # 2. Auto-Healing: Start Bastion if stopped (Uses profile from file)
      - name: 🚑 Ensure Bastion is RUNNING
        run: |
          echo "Checking Bastion instance state..."
          
          # Get Instance ID using the QA profile
          INSTANCE_ID=$(aws ec2 describe-instances \
            --profile qa-dermatech \
            --region us-east-1 \
            --filters "Name=tag:Name,Values=dermatech-qa-gateway" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          
          if [ "$INSTANCE_ID" == "None" ]; then
            echo "❌ Error: Bastion instance not found via Terraform state."
            exit 1
          fi

          # Check State
          STATE=$(aws ec2 describe-instances \
            --profile qa-dermatech \
            --region us-east-1 \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          
          echo "Instance $INSTANCE_ID is currently: $STATE"
          
          if [ "$STATE" == "stopped" ]; then
            echo "⚠️ Bastion is STOPPED. Initiating start sequence..."
            aws ec2 start-instances --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
            echo "⏳ Waiting for instance to reach 'running' state..."
            aws ec2 wait instance-running --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
            echo "✅ Bastion successfully started."
          fi

      - name: Check Bastion Reachability (Port 22)
        run: |
          echo "🔍 Testing TCP connection to bastion: ${{ env.QA_BASTION_PUBLIC_IP }}"
          timeout 60 bash -c "until cat < /dev/null > /dev/tcp/${{ env.QA_BASTION_PUBLIC_IP }}/22; do echo 'Waiting for SSH port...'; sleep 5; done" && echo "✅ Port 22 is OPEN"

      - name: Test SSH Handshake (Verbose)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
          ssh -vvv -i ~/.ssh/bastion_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ec2-user@${{ env.QA_BASTION_PUBLIC_IP }} \
            "echo '✅ SSH CONNECTION SUCCESSFUL'" || echo "❌ SSH FAILED"

  # ============================================================================
  # TRACK A: INFRASTRUCTURE (TERRAFORM - PERSISTENT ARCHITECTURE)
  # ============================================================================

  base-layer:
    name: Deploy Base (${{ matrix.account }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Events'
            path: 'account-02-events'
            profile: 'events-dermatech'
            output_var: 'VPC_EVENTS'
          - account: 'State'
            path: 'account-03-state'
            profile: 'state-dermatech'
            output_var: 'VPC_STATE'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials
      - name: Deploy ${{ matrix.account }}
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/${{ matrix.path }}
          terraform init -reconfigure
          terraform apply -auto-approve
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
          echo "✅ VPC Verified/Created: $VPC_ID"
      - name: Upload VPC ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments/${{ matrix.path }}/vpc_id.txt
          retention-days: 1

  nodes-layer:
    name: Deploy Node (${{ matrix.account }})
    needs: base-layer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Node A'
            path: 'account-04-node-a'
            profile: 'node-a-dermatech'
            output_var: 'VPC_NODE_A'
          - account: 'Node B'
            path: 'account-05-node-b'
            profile: 'node-b-dermatech'
            output_var: 'VPC_NODE_B'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials
      - name: Deploy ${{ matrix.account }}
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/${{ matrix.path }}
          terraform init -reconfigure
          terraform apply -auto-approve
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
          echo "✅ VPC Verified/Created: $VPC_ID"
      - name: Upload VPC ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments/${{ matrix.path }}/vpc_id.txt
          retention-days: 1

  qa-hub:
    name: Deploy QA Hub (Orchestrator)
    needs: [base-layer, nodes-layer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with: { name: 'VPC_EVENTS', path: 'VPC_EVENTS' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_STATE', path: 'VPC_STATE' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_A', path: 'VPC_NODE_A' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_B', path: 'VPC_NODE_B' }
      - name: Extract VPC IDs
        run: |
          EVENTS_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_EVENTS/vpc_id.txt | head -n 1)
          STATE_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_STATE/vpc_id.txt | head -n 1)
          NODE_A_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_A/vpc_id.txt | head -n 1)
          NODE_B_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_B/vpc_id.txt | head -n 1)
          echo "VPC_EVENTS=$EVENTS_ID" >> $GITHUB_ENV
          echo "VPC_STATE=$STATE_ID" >> $GITHUB_ENV
          echo "VPC_NODE_A=$NODE_A_ID" >> $GITHUB_ENV
          echo "VPC_NODE_B=$NODE_B_ID" >> $GITHUB_ENV
      - name: Deploy QA Hub
        env:
          AWS_PROFILE: qa-dermatech
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/account-01-qa
          terraform init -reconfigure
          
          # Peering Stability Retry Logic
          if ! terraform apply -auto-approve \
            -var="events_vpc_id=${{ env.VPC_EVENTS }}" \
            -var="state_vpc_id=${{ env.VPC_STATE }}" \
            -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" \
            -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"; then
            
            echo "⚠️ First attempt failed. Executing partial destroy..."
            terraform destroy -auto-approve -var="events_vpc_id=null" -var="state_vpc_id=null" -var="node_a_vpc_id=null" -var="node_b_vpc_id=null" || true
            sleep 20
            
            terraform apply -auto-approve \
              -var="events_vpc_id=${{ env.VPC_EVENTS }}" \
              -var="state_vpc_id=${{ env.VPC_STATE }}" \
              -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" \
              -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"
          fi

          ALB_DNS=$(terraform output -raw QA_ALB_DNS_NAME)
          echo "ALB_URL=$ALB_DNS" > alb_dns.txt
          echo "🎉 GLOBAL INFRASTRUCTURE SUCCESSFULLY DEPLOYED"
          echo "::notice title=ALB DNS::The Load Balancer DNS is: $ALB_DNS"
      - name: Upload ALB DNS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALB_DNS
          path: infrastructure/terraform/environments/account-01-qa/alb_dns.txt

  # ============================================================================
  # TRACK B: COMPILATION & DOCKER (PARALLEL PROCESS)
  # ============================================================================

  compile-code:
    name: 🛠️ Compile Source Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with: { node-version: 18, cache: 'npm' }
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Build Microservices (Nx)
        run: npx nx run-many --target=build --all --configuration=production
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - name: Build Flutter Web
        run: |
          cd apps/clients/mobile_app
          flutter build web --release --dart-define=API_URL=/api/v1
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-files', path: 'dist', retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: 'flutter-build', path: 'apps/clients/mobile_app/build/web', retention-days: 1 }

  docker-build:
    name: 🐳 Docker Build & Push
    needs: compile-code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: 'auth-service'
            dockerfile: 'apps/services/core/auth-service/Dockerfile'
          - service: 'patient-service'
            dockerfile: 'apps/services/core/patient-service/Dockerfile'
          - service: 'api-gateway'
            dockerfile: 'apps/services/api-gateway/Dockerfile'
          - service: 'dermatech-frontend'
            dockerfile: 'apps/clients/mobile_app/Dockerfile'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with: { name: 'dist-files', path: 'dist' }
      - uses: actions/download-artifact@v4
        with: { name: 'flutter-build', path: 'apps/clients/mobile_app/build/web' }
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest

  # ============================================================================
  # TRACK C: INSTALLATION & DEPLOYMENT (SECURE BASTION TUNNELING)
  # ============================================================================

  deploy-events:
    name: 🚀 Deploy Events (Via QA Bastion)
    needs: [qa-hub, test-bastion-connection]
    runs-on: ubuntu-latest
    steps:
      # 1. Restore Credentials (Fix)
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      # 2. Auto-Healing (Fix: uses profile from file)
      - name: 🚑 Ensure Bastion is RUNNING
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --profile qa-dermatech \
            --region us-east-1 \
            --filters "Name=tag:Name,Values=dermatech-qa-gateway" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          
          STATE=$(aws ec2 describe-instances \
            --profile qa-dermatech \
            --region us-east-1 \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          
          if [ "$STATE" == "stopped" ]; then
            echo "⚠️ Bastion STOPPED. Starting..."
            aws ec2 start-instances --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
            aws ec2 wait instance-running --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
          fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
      
      # 3. Active Wait Loop (Using Static IP from ENV)
      - name: ⏳ Active Wait for Internal Connectivity
        run: |
          echo "Testing connectivity from Bastion to Events..."
          end=$((SECONDS+600))
          while [ $SECONDS -lt $end ]; do
            # Note: Using ${{ env.EVENTS_PRIVATE_IP }} here
            if ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 ec2-user@${{ env.QA_BASTION_PUBLIC_IP }} \
               "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${{ env.EVENTS_PRIVATE_IP }}/22'" 2>/dev/null; then
               echo "✅ Events is reachable via internal network."
               exit 0
            fi
            echo "⏳ Waiting for connectivity... ($((end-SECONDS))s left)"
            sleep 5
          done
          echo "❌ Timeout waiting for Events"
          exit 1

      - name: Deploy via SSH Tunnel
        run: |
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ env.QA_BASTION_PUBLIC_IP }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no
            
          Host events-server
            HostName ${{ env.EVENTS_PRIVATE_IP }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF
          
          ssh events-server << 'ENDSSH'
            echo "✅ SECURITY CHECK: Connected via QA Bastion Tunnel"
            
            # Install Docker Compose
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            
            # Create directories
            sudo mkdir -p /data/kafka /data/zookeeper /data/rabbitmq /data/mosquitto/config
            sudo chmod -R 777 /data
            
            # Configure Mosquitto
            echo "listener 1883" | sudo tee /data/mosquitto/config/mosquitto.conf
            echo "allow_anonymous true" | sudo tee -a /data/mosquitto/config/mosquitto.conf

            # Create docker-compose.yml
            cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            zookeeper:
              image: confluentinc/cp-zookeeper:7.5.0
              restart: always
              environment: 
                ZOOKEEPER_CLIENT_PORT: 2181
              volumes: 
                - /data/zookeeper:/var/lib/zookeeper/data
              networks: 
                - infra_net
            kafka:
              image: confluentinc/cp-kafka:7.5.0
              restart: always
              depends_on: 
                - zookeeper
              ports: 
                - "9092:9092"
              volumes: 
                - /data/kafka:/var/lib/kafka/data
              environment:
                KAFKA_BROKER_ID: 1
                KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
                KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${{ env.EVENTS_PRIVATE_IP }}:9092
                KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
              networks: 
                - infra_net
            rabbitmq:
              image: rabbitmq:3.12-management-alpine
              restart: always
              ports: 
                - "5672:5672"
                - "15672:15672"
              volumes: 
                - /data/rabbitmq:/var/lib/rabbitmq
              environment:
                RABBITMQ_DEFAULT_USER: admin
                RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_PASS }}
              networks: 
                - infra_net
            mosquitto:
              image: eclipse-mosquitto:2.0
              restart: always
              ports: 
                - "1883:1883"
                - "9001:9001"
              volumes: 
                - /data/mosquitto/config:/mosquitto/config
              networks: 
                - infra_net
          networks:
            infra_net:
              driver: bridge
          EOF
            
            # Start services
            sudo docker compose up -d
            
            echo "✅ Events services deployed successfully"
          ENDSSH

  deploy-state:
    name: 🚀 Deploy State (Via QA Bastion)
    needs: [qa-hub, test-bastion-connection]
    runs-on: ubuntu-latest
    steps:
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: 🚑 Ensure Bastion is RUNNING
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --profile qa-dermatech --region us-east-1 --filters "Name=tag:Name,Values=dermatech-qa-gateway" --query "Reservations[0].Instances[0].InstanceId" --output text)
          STATE=$(aws ec2 describe-instances --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID --query "Reservations[0].Instances[0].State.Name" --output text)
          if [ "$STATE" == "stopped" ]; then
            aws ec2 start-instances --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
            aws ec2 wait instance-running --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
          fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
      
      - name: ⏳ Active Wait for Internal Connectivity
        run: |
          echo "Testing connectivity from Bastion to State..."
          end=$((SECONDS+600))
          while [ $SECONDS -lt $end ]; do
            if ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 ec2-user@${{ env.QA_BASTION_PUBLIC_IP }} \
               "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${{ env.STATE_PRIVATE_IP }}/22'" 2>/dev/null; then
               echo "✅ State is reachable via internal network."
               exit 0
            fi
            sleep 5
          done
          echo "❌ Timeout waiting for State"
          exit 1

      - name: Deploy via SSH Tunnel
        run: |
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ env.QA_BASTION_PUBLIC_IP }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no
          Host state-server
            HostName ${{ env.STATE_PRIVATE_IP }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF
          ssh state-server << 'ENDSSH'
            echo "✅ SECURITY CHECK: Connected via QA Bastion Tunnel"
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            sudo mkdir -p /data/redis /data/grafana /data/prometheus
            sudo chmod -R 777 /data
            cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            redis:
              image: redis:7.2-alpine
              restart: always
              ports: 
                - "6379:6379"
              command: redis-server --appendonly yes --requirepass ${{ secrets.REDIS_PASSWORD }}
              volumes: 
                - /data/redis:/data
            grafana:
              image: grafana/grafana:latest
              restart: always
              ports: 
                - "3000:3000"
              environment:
                GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
              volumes: 
                - /data/grafana:/var/lib/grafana
          EOF
            sudo docker compose up -d
            echo "✅ State services deployed successfully"
          ENDSSH

  deploy-apps:
    name: 🚀 Deploy Apps (Via QA Bastion)
    needs: [docker-build, deploy-events, deploy-state]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node_ip: 10.3.1.10
            node_name: node-a
          - node_ip: 10.4.1.10
            node_name: node-b
    steps:
      - uses: actions/download-artifact@v4
        with: { name: 'ALB_DNS', path: 'ALB_DNS' }
        
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: 🚑 Ensure Bastion is RUNNING
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --profile qa-dermatech --region us-east-1 --filters "Name=tag:Name,Values=dermatech-qa-gateway" --query "Reservations[0].Instances[0].InstanceId" --output text)
          STATE=$(aws ec2 describe-instances --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID --query "Reservations[0].Instances[0].State.Name" --output text)
          if [ "$STATE" == "stopped" ]; then
            aws ec2 start-instances --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
            aws ec2 wait instance-running --profile qa-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
          fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/bastion_key
          chmod 600 ~/.ssh/bastion_key
      
      - name: ⏳ Active Wait for Internal Connectivity
        run: |
          echo "Testing connectivity from Bastion to ${{ matrix.node_name }}..."
          end=$((SECONDS+600))
          while [ $SECONDS -lt $end ]; do
            if ssh -i ~/.ssh/bastion_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 ec2-user@${{ env.QA_BASTION_PUBLIC_IP }} \
               "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${{ matrix.node_ip }}/22'" 2>/dev/null; then
               echo "✅ ${{ matrix.node_name }} is reachable via internal network."
               exit 0
            fi
            echo "⏳ Waiting for connectivity... ($((end-SECONDS))s left)"
            sleep 5
          done
          echo "❌ Timeout waiting for ${{ matrix.node_name }}"
          exit 1

      - name: Deploy to ${{ matrix.node_name }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ env.QA_BASTION_PUBLIC_IP }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no
          Host ${{ matrix.node_name }}
            HostName ${{ matrix.node_ip }}
            User ec2-user
            IdentityFile ~/.ssh/bastion_key
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF
          ssh ${{ matrix.node_name }} << 'ENDSSH'
            echo "✅ SECURITY CHECK: Connected via QA Bastion Tunnel"
            
            # Install Docker Compose
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Create docker-compose.yml
            cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            frontend:
              image: ${{ secrets.DOCKER_USERNAME }}/dermatech-frontend:latest
              restart: always
              ports: 
                - "80:80"
            api-gateway:
              image: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
              restart: always
              ports: 
                - "3000:3000"
              environment:
                - AUTH_SERVICE_URL=http://auth-service:3000
                - PATIENT_SERVICE_URL=http://patient-service:3000
            auth-service:
              image: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
              restart: always
              ports: 
                - "3001:3000"
              environment:
                - NODE_ENV=production
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=auth-service
                - KAFKA_GROUP_ID=${{ secrets.KAFKA_GROUP_ID }}
                - RABBITMQ_HOST=${{ env.EVENTS_PRIVATE_IP }}
                - REDIS_HOST=${{ env.STATE_PRIVATE_IP }}
                - REDIS_PORT=6379
                - REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
                - JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
                - JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
                - DATABASE_PORT=${{ secrets.DATABASE_PORT }}
                - DATABASE_HOST=${{ secrets.DATABASE_HOST }}
                - DATABASE_USER=${{ secrets.DATABASE_USER }}
                - DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DATABASE_NAME=${{ secrets.DATABASE_NAME }}
                - DATABASE_SYNC=${{ secrets.DATABASE_SYNC }}
            patient-service:
              image: ${{ secrets.DOCKER_USERNAME }}/patient-service:latest
              restart: always
              ports: 
                - "3002:3000"
              environment:
                - NODE_ENV=production
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=patient-service
                - KAFKA_GROUP_ID=${{ secrets.KAFKA_GROUP_ID }}
                - REDIS_HOST=${{ env.STATE_PRIVATE_IP }}
                - REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                - DB_PORT=${{ secrets.DATABASE_PORT }}
                - DB_HOST=${{ secrets.DATABASE_HOST }}
                - DB_USER=${{ secrets.DATABASE_USER }}
                - DB_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DB_NAME=${{ secrets.DATABASE_NAME }}
                - DB_SYNC=${{ secrets.DATABASE_SYNC }}
          EOF
            
            # Pull and deploy
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            
            echo "✅ Applications deployed successfully on ${{ matrix.node_name }}"
          ENDSSH
          
      - name: 🏁 Final Summary
        if: matrix.node_name == 'node-a'
        run: |
          ALB_DNS=$(cat ALB_DNS/alb_dns.txt | grep -o 'ALB_URL=.*' | cut -d'=' -f2)
          echo "🎉 DEPLOYMENT COMPLETE (SECURE TUNNEL)"
          echo "🌐 URL DEL LOAD BALANCER: http://$ALB_DNS"
          echo "::notice title=Deployment Complete::Application available at http://$ALB_DNS"