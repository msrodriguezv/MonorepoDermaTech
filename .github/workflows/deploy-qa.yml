name: "TURBO DEPLOY: DermaTech Global Infrastructure"

on:
  push:
    branches: [ qa ]

jobs:
  # ==========================================
  # STEP 0: FORCE CLEANUP (CRITICAL)
  # Removes orphaned resources to prevent conflicts
  # ==========================================
  cleanup:
    name: Force Cleanup Orphaned Resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Delete All VPC Peering Connections
        run: |
          # Iterates through all profiles to ensure a clean network slate
          for profile in qa-dermatech events-dermatech state-dermatech node-a-dermatech node-b-dermatech; do
            echo "🧹 Cleaning peerings for profile: $profile"
            
            # Fetch active or pending peering connections
            peering_ids=$(aws ec2 describe-vpc-peering-connections \
              --profile $profile \
              --region us-east-1 \
              --filters "Name=status-code,Values=active,pending-acceptance" \
              --query 'VpcPeeringConnections[*].VpcPeeringConnectionId' \
              --output text 2>/dev/null || echo "")
            
            # Delete each connection found
            for id in $peering_ids; do
              echo "  ❌ Deleting peering: $id"
              aws ec2 delete-vpc-peering-connection \
                --profile $profile \
                --region us-east-1 \
                --vpc-peering-connection-id $id || true
            done
          done

      - name: Delete Network Interfaces (ENIs)
        run: |
          for profile in qa-dermatech events-dermatech state-dermatech node-a-dermatech node-b-dermatech; do
            echo "🧹 Cleaning ENIs for: $profile"
            
            # Fetch available (detached) network interfaces
            eni_ids=$(aws ec2 describe-network-interfaces \
              --profile $profile \
              --region us-east-1 \
              --query 'NetworkInterfaces[?Status==`available`].NetworkInterfaceId' \
              --output text 2>/dev/null || echo "")
            
            # Delete each ENI
            for id in $eni_ids; do
              echo "  ❌ Deleting ENI: $id"
              aws ec2 delete-network-interface \
                --profile $profile \
                --region us-east-1 \
                --network-interface-id $id || true
            done
          done

      - name: Wait for AWS Propagation
        run: sleep 30

  # ==========================================
  # LEVEL 1: FOUNDATION (EVENTS & STATE)
  # Independent accounts with no external dependencies
  # ==========================================
  base-layer:
    name: Deploy Base (${{ matrix.account }})
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Events'
            path: 'account-02-events'
            profile: 'events-dermatech'
            output_var: 'VPC_EVENTS'
          - account: 'State'
            path: 'account-03-state'
            profile: 'state-dermatech'
            output_var: 'VPC_STATE'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2

      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Deploy ${{ matrix.account }}
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/${{ matrix.path }}
          terraform init -reconfigure
          
          # Idempotency check: destroy and retry if apply fails
          if ! terraform apply -auto-approve; then
            echo "⚠️ First attempt failed. Executing destroy..."
            terraform destroy -auto-approve || true
            sleep 20
            terraform apply -auto-approve
          fi
          
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
          echo "✅ VPC Created: $VPC_ID"
      
      - name: Upload VPC ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments/${{ matrix.path }}/vpc_id.txt
          retention-days: 1

  # ==========================================
  # LEVEL 2: WORKER NODES (A & B)
  # Now passive: They do NOT require Events/State IDs anymore
  # ==========================================
  nodes-layer:
    name: Deploy Node (${{ matrix.account }})
    needs: base-layer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Node A'
            path: 'account-04-node-a'
            profile: 'node-a-dermatech'
            output_var: 'VPC_NODE_A'
          - account: 'Node B'
            path: 'account-05-node-b'
            profile: 'node-b-dermatech'
            output_var: 'VPC_NODE_B'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2

      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      # NOTE: We no longer download Events/State artifacts here.
      # Nodes are now decoupled and deployed independently.

      - name: Deploy ${{ matrix.account }}
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/${{ matrix.path }}
          terraform init -reconfigure
          
          # Simplified Apply: No extra variables passed
          if ! terraform apply -auto-approve; then
            echo "⚠️ First attempt failed. Executing destroy..."
            terraform destroy -auto-approve || true
            sleep 20
            terraform apply -auto-approve
          fi
          
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
          echo "✅ VPC Created: $VPC_ID"

      - name: Upload VPC ID Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments/${{ matrix.path }}/vpc_id.txt
          retention-days: 1

  # ==========================================
  # LEVEL 3: QA HUB (THE ORCHESTRATOR)
  # This step connects everything. Requires ALL VPC IDs.
  # ==========================================
  qa-hub:
    name: Deploy QA Hub (Orchestrator)
    needs: [base-layer, nodes-layer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with: { name: 'VPC_EVENTS', path: 'VPC_EVENTS' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_STATE', path: 'VPC_STATE' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_A', path: 'VPC_NODE_A' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_B', path: 'VPC_NODE_B' }

      - name: Extract VPC IDs (Regex Sanitization)
        run: |
          # Extracts strictly 'vpc-xxxx' patterns to prevent injection errors
          EVENTS_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_EVENTS/vpc_id.txt | head -n 1)
          STATE_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_STATE/vpc_id.txt | head -n 1)
          NODE_A_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_A/vpc_id.txt | head -n 1)
          NODE_B_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_B/vpc_id.txt | head -n 1)

          # Export to GITHUB_ENV for next steps
          echo "VPC_EVENTS=$EVENTS_ID" >> $GITHUB_ENV
          echo "VPC_STATE=$STATE_ID" >> $GITHUB_ENV
          echo "VPC_NODE_A=$NODE_A_ID" >> $GITHUB_ENV
          echo "VPC_NODE_B=$NODE_B_ID" >> $GITHUB_ENV

          echo "🎯 Validated IDs:"
          echo " - Events: $EVENTS_ID"
          echo " - State:  $STATE_ID"
          echo " - Node A: $NODE_A_ID"
          echo " - Node B: $NODE_B_ID"

      - name: Deploy QA Hub
        env:
          AWS_PROFILE: qa-dermatech
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/account-01-qa
          terraform init -reconfigure
          
          # Hub Deployment: Passes all VPC IDs to create peerings and routes
          if ! terraform apply -auto-approve \
            -var="events_vpc_id=${{ env.VPC_EVENTS }}" \
            -var="state_vpc_id=${{ env.VPC_STATE }}" \
            -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" \
            -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"; then
            
            echo "⚠️ First attempt failed. Executing destroy..."
            # Pass null variables for destroy to avoid validation errors
            terraform destroy -auto-approve \
              -var="events_vpc_id=null" -var="state_vpc_id=null" \
              -var="node_a_vpc_id=null" -var="node_b_vpc_id=null" || true
            sleep 20
            
            # Retry Deployment
            terraform apply -auto-approve \
              -var="events_vpc_id=${{ env.VPC_EVENTS }}" \
              -var="state_vpc_id=${{ env.VPC_STATE }}" \
              -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" \
              -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"
          fi
          
          echo "🎉 GLOBAL INFRASTRUCTURE SUCCESSFULLY DEPLOYED"