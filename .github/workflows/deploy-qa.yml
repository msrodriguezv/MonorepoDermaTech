name: "TURBO DEPLOY: DermaTech Global"

on:
  push:
    branches: [ qa ]

jobs:
  # ==========================================
  # PASO 0: LIMPIEZA FORZADA (CRÍTICO)
  # Elimina recursos huérfanos que bloquean
  # ==========================================
  cleanup:
    name: Force Cleanup Orphaned Resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Delete All VPC Peering Connections
        run: |
          # Lista TODAS las cuentas a limpiar
          for profile in qa-dermatech events-dermatech state-dermatech node-a-dermatech node-b-dermatech; do
            echo "🧹 Limpiando peerings en perfil: $profile"
            
            # Lista todos los peerings activos/pendientes
            peering_ids=$(aws ec2 describe-vpc-peering-connections \
              --profile $profile \
              --region us-east-1 \
              --filters "Name=status-code,Values=active,pending-acceptance" \
              --query 'VpcPeeringConnections[*].VpcPeeringConnectionId' \
              --output text 2>/dev/null || echo "")
            
            # Elimina cada uno
            for id in $peering_ids; do
              echo "  ❌ Eliminando peering: $id"
              aws ec2 delete-vpc-peering-connection \
                --profile $profile \
                --region us-east-1 \
                --vpc-peering-connection-id $id || true
            done
          done

      - name: Delete Network Interfaces (ENIs)
        run: |
          for profile in qa-dermatech events-dermatech state-dermatech node-a-dermatech node-b-dermatech; do
            echo "🧹 Limpiando ENIs en: $profile"
            
            eni_ids=$(aws ec2 describe-network-interfaces \
              --profile $profile \
              --region us-east-1 \
              --query 'NetworkInterfaces[?Status==`available`].NetworkInterfaceId' \
              --output text 2>/dev/null || echo "")
            
            for id in $eni_ids; do
              echo "  ❌ Eliminando ENI: $id"
              aws ec2 delete-network-interface \
                --profile $profile \
                --region us-east-1 \
                --network-interface-id $id || true
            done
          done

      - name: Wait for Cleanup
        run: sleep 30

  # ==========================================
  # NIVEL 1: CIMIENTOS (EVENTS y STATE)
  # ==========================================
  base-layer:
    name: Deploy Base (${{ matrix.account }})
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continúa aunque uno falle
      matrix:
        include:
          - account: 'Events'
            path: 'account-02-events'
            profile: 'events-dermatech'
            output_var: 'VPC_EVENTS'
          - account: 'State'
            path: 'account-03-state'
            profile: 'state-dermatech'
            output_var: 'VPC_STATE'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2

      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Deploy ${{ matrix.account }}
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/${{ matrix.path }}
          terraform init -reconfigure
          
          # Intenta aplicar, si falla destruye y vuelve a aplicar
          if ! terraform apply -auto-approve; then
            echo "⚠️ Primer intento falló, ejecutando destroy..."
            terraform destroy -auto-approve || true
            sleep 20
            terraform apply -auto-approve
          fi
          
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
          echo "✅ VPC creada: $VPC_ID"
      
      - name: Upload VPC ID
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments/${{ matrix.path }}/vpc_id.txt
          retention-days: 1

  # ==========================================
  # NIVEL 2: NODOS (A y B)
  # ==========================================
  nodes-layer:
    name: Deploy Node (${{ matrix.account }})
    needs: base-layer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Node A'
            path: 'account-04-node-a'
            profile: 'node-a-dermatech'
            output_var: 'VPC_NODE_A'
          - account: 'Node B'
            path: 'account-05-node-b'
            profile: 'node-b-dermatech'
            output_var: 'VPC_NODE_B'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2

      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      # CRÍTICO: Descarga los IDs de Events y State
      - uses: actions/download-artifact@v4
        with: 
          name: 'VPC_EVENTS'
          path: 'artifacts/events'
      - uses: actions/download-artifact@v4
        with: 
          name: 'VPC_STATE'
          path: 'artifacts/state'

      - name: Read VPC IDs (BLINDADO CON REGEX)
        run: |
          echo "🔍 Debugging contenido crudo:"
          cat artifacts/events/vpc_id.txt
          
          # --- CORRECCIÓN CRÍTICA: EXTRACCIÓN POR REGEX ---
          # Busca estrictamente el patrón 'vpc-xxxx' ignorando basura
          EVENTS_ID=$(grep -o 'vpc-[a-z0-9]*' artifacts/events/vpc_id.txt | head -n 1)
          STATE_ID=$(grep -o 'vpc-[a-z0-9]*' artifacts/state/vpc_id.txt | head -n 1)
          
          # Validación de seguridad
          if [[ -z "$EVENTS_ID" ]]; then
            echo "❌ ERROR FATAL: No se pudo extraer un ID válido para Events"
            exit 1
          fi

          echo "EVENTS_VPC_ID=$EVENTS_ID" >> $GITHUB_ENV
          echo "STATE_VPC_ID=$STATE_ID" >> $GITHUB_ENV
          
          echo "🎯 ID LIMPIO Events: $EVENTS_ID"
          echo "🎯 ID LIMPIO State:  $STATE_ID"

      - name: Deploy ${{ matrix.account }}
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/${{ matrix.path }}
          terraform init -reconfigure
          
          # Pasa los IDs necesarios para peering
          if ! terraform apply -auto-approve \
            -var="events_vpc_id=${{ env.EVENTS_VPC_ID }}" \
            -var="state_vpc_id=${{ env.STATE_VPC_ID }}"; then
            echo "⚠️ Primer intento falló, ejecutando destroy..."
            terraform destroy -auto-approve \
              -var="events_vpc_id=${{ env.EVENTS_VPC_ID }}" \
              -var="state_vpc_id=${{ env.STATE_VPC_ID }}" || true
            sleep 20
            terraform apply -auto-approve \
              -var="events_vpc_id=${{ env.EVENTS_VPC_ID }}" \
              -var="state_vpc_id=${{ env.STATE_VPC_ID }}"
          fi
          
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
          echo "✅ VPC creada: $VPC_ID"

      - name: Upload VPC ID
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments/${{ matrix.path }}/vpc_id.txt
          retention-days: 1

  # ==========================================
  # NIVEL 3: QA HUB (FINAL)
  # ==========================================
  qa-hub:
    name: Deploy QA Hub
    needs: [base-layer, nodes-layer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      
      - name: Restore Credentials
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - uses: actions/download-artifact@v4
        with: { name: 'VPC_EVENTS', path: 'VPC_EVENTS' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_STATE', path: 'VPC_STATE' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_A', path: 'VPC_NODE_A' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_B', path: 'VPC_NODE_B' }

      - name: Read All VPC IDs (BLINDADO CON REGEX)
        run: |
          # --- CORRECCIÓN CRÍTICA: EXTRACCIÓN POR REGEX ---
          EVENTS_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_EVENTS/vpc_id.txt | head -n 1)
          STATE_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_STATE/vpc_id.txt | head -n 1)
          NODE_A_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_A/vpc_id.txt | head -n 1)
          NODE_B_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_B/vpc_id.txt | head -n 1)

          echo "VPC_EVENTS=$EVENTS_ID" >> $GITHUB_ENV
          echo "VPC_STATE=$STATE_ID" >> $GITHUB_ENV
          echo "VPC_NODE_A=$NODE_A_ID" >> $GITHUB_ENV
          echo "VPC_NODE_B=$NODE_B_ID" >> $GITHUB_ENV

          echo "🎯 ID LIMPIOS DETECTADOS:"
          echo " - Events: $EVENTS_ID"
          echo " - State:  $STATE_ID"
          echo " - Node A: $NODE_A_ID"
          echo " - Node B: $NODE_B_ID"

      - name: Deploy QA Hub
        env:
          AWS_PROFILE: qa-dermatech
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments/account-01-qa
          terraform init -reconfigure
          
          if ! terraform apply -auto-approve \
            -var="events_vpc_id=${{ env.VPC_EVENTS }}" \
            -var="state_vpc_id=${{ env.VPC_STATE }}" \
            -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" \
            -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"; then
            echo "⚠️ Primer intento falló, ejecutando destroy..."
            terraform destroy -auto-approve \
              -var="events_vpc_id=null" -var="state_vpc_id=null" \
              -var="node_a_vpc_id=null" -var="node_b_vpc_id=null" || true
            sleep 20
            terraform apply -auto-approve \
              -var="events_vpc_id=${{ env.VPC_EVENTS }}" \
              -var="state_vpc_id=${{ env.VPC_STATE }}" \
              -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" \
              -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"
          fi
          
          echo "🎉 INFRAESTRUCTURA COMPLETA DESPLEGADA"