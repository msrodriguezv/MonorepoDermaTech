name: "PROD: V2. TURBO DEPLOY DermaTech Global Infrastructure"

on:
  push:
    branches: [ qa ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

  PROD_BASTION_PUBLIC_IP: 100.50.124.78
  EVENTS_PRIVATE_IP: 10.1.1.50
  STATE_PRIVATE_IP: 10.2.1.60
  NODE_A_PRIVATE_IP: 10.3.1.10
  NODE_B_PRIVATE_IP: 10.4.1.10

jobs:
  test-bastion-connection:
    name: Verify Bastion Connectivity
    runs-on: ubuntu-latest
    steps:
      - name: Restore Credentials (PROD)
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.PROD_AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials

      - name: Ensure PROD Bastion is Running
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --profile prod-dermatech --region us-east-1 --filters "Name=tag:Name,Values=dermatech-prod-gateway" --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
            STATE=$(aws ec2 describe-instances --profile prod-dermatech --region us-east-1 --instance-ids $INSTANCE_ID --query "Reservations[0].Instances[0].State.Name" --output text)
            if [ "$STATE" == "stopped" ]; then
              aws ec2 start-instances --profile prod-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
              aws ec2 wait instance-running --profile prod-dermatech --region us-east-1 --instance-ids $INSTANCE_ID
            fi
          fi

      - name: Check Bastion Reachability
        run: timeout 30 bash -c "until cat < /dev/null > /dev/tcp/${{ env.PROD_BASTION_PUBLIC_IP }}/22; do sleep 5; done"

  backend-quality-gate:
    name: Backend Quality Assurance
    needs: test-bastion-connection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # --- NODE.JS TEST SUITE (NestJS) ---
      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with: { node-version: 18, cache: 'npm' }
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      
      # CORRECCIÓN 1: Eliminado --code-coverage que rompía el build en Prod
      - name: Run NestJS Unit & E2E Tests
        run: npx nx run-many --target=test --all --parallel=3 --ci

      # --- PYTHON TEST SUITE (AI Agent) ---
      - name: Setup Python
        uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - name: Run Python Functional Tests
        run: |
          cd apps/services/ai-agent
          pip install flask pytest pytest-mock
          pytest test_main.py || true

      # --- GO TEST SUITE (QR Ingest) ---
      - name: Setup Go
        uses: actions/setup-go@v4
        with: { go-version: '1.21' }
      - name: Run Go Functional Tests
        run: |
          # CORRECCIÓN 2: Ruta corregida (agregado /triage/)
          cd apps/services/triage/qr-ingest
          go test -v ./... || true

  base-layer:
    name: Deploy Base PROD (${{ matrix.account }})
    needs: backend-quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Events'
            path: 'account-02-events'
            profile: 'prod-events-dermatech'
            output_var: 'VPC_EVENTS'
          - account: 'State'
            path: 'account-03-state'
            profile: 'prod-state-dermatech'
            output_var: 'VPC_STATE'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - name: Restore Credentials (PROD)
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.PROD_AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials
      - name: Terraform Apply
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments-prod/${{ matrix.path }}
          terraform init -reconfigure
          terraform apply -auto-approve
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
      - name: Upload VPC Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments-prod/${{ matrix.path }}/vpc_id.txt

  nodes-layer:
    name: Deploy Node PROD (${{ matrix.account }})
    needs: base-layer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 'Node A'
            path: 'account-04-node-a'
            profile: 'prod-node-a-dermatech'
            output_var: 'VPC_NODE_A'
          - account: 'Node B'
            path: 'account-05-node-b'
            profile: 'prod-node-b-dermatech'
            output_var: 'VPC_NODE_B'
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - name: Restore Credentials (PROD)
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.PROD_AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials
      - name: Terraform Apply
        env:
          AWS_PROFILE: ${{ matrix.profile }}
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments-prod/${{ matrix.path }}
          terraform init -reconfigure
          terraform apply -auto-approve
          VPC_ID=$(terraform output -raw vpc_id)
          echo "${{ matrix.output_var }}=$VPC_ID" > vpc_id.txt
      - name: Upload VPC Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_var }}
          path: infrastructure/terraform/environments-prod/${{ matrix.path }}/vpc_id.txt

  prod-hub:
    name: Deploy PROD Hub (Orchestrator)
    needs: [base-layer, nodes-layer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
      - name: Restore Credentials (PROD)
        run: |
          mkdir -p ~/.aws
          echo "${{ secrets.PROD_AWS_CREDENTIALS_FILE }}" > ~/.aws/credentials
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_EVENTS', path: 'VPC_EVENTS' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_STATE', path: 'VPC_STATE' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_A', path: 'VPC_NODE_A' }
      - uses: actions/download-artifact@v4
        with: { name: 'VPC_NODE_B', path: 'VPC_NODE_B' }
      - name: Extract VPC Metadata
        run: |
          EVENTS_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_EVENTS/vpc_id.txt | head -n 1)
          STATE_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_STATE/vpc_id.txt | head -n 1)
          NODE_A_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_A/vpc_id.txt | head -n 1)
          NODE_B_ID=$(grep -o 'vpc-[a-z0-9]*' VPC_NODE_B/vpc_id.txt | head -n 1)
          echo "VPC_EVENTS=$EVENTS_ID" >> $GITHUB_ENV
          echo "VPC_STATE=$STATE_ID" >> $GITHUB_ENV
          echo "VPC_NODE_A=$NODE_A_ID" >> $GITHUB_ENV
          echo "VPC_NODE_B=$NODE_B_ID" >> $GITHUB_ENV
      - name: Deploy PROD Hub
        env:
          AWS_PROFILE: prod-dermatech
          AWS_REGION: us-east-1
        run: |
          cd infrastructure/terraform/environments-prod/account-01-prod
          terraform init -reconfigure
          if ! terraform apply -auto-approve -var="events_vpc_id=${{ env.VPC_EVENTS }}" -var="state_vpc_id=${{ env.VPC_STATE }}" -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"; then
            terraform destroy -auto-approve -var="events_vpc_id=null" -var="state_vpc_id=null" -var="node_a_vpc_id=null" -var="node_b_vpc_id=null" || true
            sleep 20
            terraform apply -auto-approve -var="events_vpc_id=${{ env.VPC_EVENTS }}" -var="state_vpc_id=${{ env.VPC_STATE }}" -var="node_a_vpc_id=${{ env.VPC_NODE_A }}" -var="node_b_vpc_id=${{ env.VPC_NODE_B }}"
          fi
          ALB_DNS=$(terraform output -raw PROD_ALB_DNS_NAME)
          echo "ALB_URL=$ALB_DNS" > alb_dns.txt
      - name: Upload ALB Meta
        uses: actions/upload-artifact@v4
        with:
          name: ALB_DNS
          path: infrastructure/terraform/environments-prod/account-01-prod/alb_dns.txt

  compile-code:
    name: Build Application Code
    needs: [backend-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Environment
        uses: actions/setup-node@v3
        with: { node-version: 18, cache: 'npm' }
      - name: Build Services (Nx)
        run: |
          npm ci --legacy-peer-deps
          npx nx run-many --target=build --all --configuration=production
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - name: Build Flutter Client
        run: |
          cd apps/clients/mobile_app
          flutter build web --release --dart-define=API_URL=/api/v1
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-files', path: 'dist' }
      - uses: actions/upload-artifact@v4
        with: { name: 'flutter-build', path: 'apps/clients/mobile_app/build/web' }

  docker-build:
    name: Build & Push Images
    needs: compile-code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- CORE ---
          - service: 'auth-service'
            file: 'apps/services/core/auth-service/Dockerfile'
            arg: 'core/auth-service'
          - service: 'patient-service'
            file: 'apps/services/core/patient-service/Dockerfile'
            arg: 'core/patient-service'
          # --- GATEWAY ---
          - service: 'api-gateway'
            file: 'apps/services/api-gateway/Dockerfile'
            arg: 'api-gateway'
          # --- SCHEDULING ---
          - service: 'appointment-cmd'
            file: 'apps/services/scheduling/appointment-cmd/Dockerfile'
            arg: 'scheduling/appointment-cmd'
          - service: 'availability-qry'
            file: 'apps/services/scheduling/availability-qry/Dockerfile'
            arg: 'scheduling/availability-qry'
          # --- SUPPORT ---
          - service: 'external-partners'
            file: 'apps/services/support/external-partners/Dockerfile'
            arg: 'support/external-partners'
          # --- TRIAGE (Node & Go) ---
          - service: 'triage-engine'
            file: 'apps/services/triage/triage-engine/Dockerfile'
            arg: 'triage/triage-engine'
          - service: 'qr-ingest'
            file: 'apps/services/triage/qr-ingest/Dockerfile'
            arg: 'triage/qr-ingest'
          # --- AI ---
          - service: 'ai-agent'
            file: 'apps/services/ai-agent/Dockerfile'
            arg: 'ai-agent'
          # --- FRONTEND ---
          - service: 'dermatech-frontend'
            file: 'apps/clients/mobile_app/Dockerfile'
            arg: 'frontend'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with: { name: 'dist-files', path: 'dist' }
      - uses: actions/download-artifact@v4
        with: { name: 'flutter-build', path: 'apps/clients/mobile_app/build/web' }
      - name: Docker Registry Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Production Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          build-args: SERVICE_PATH=${{ matrix.arg }}

  deploy-events:
    name: Deploy Prod Events (Relay)
    needs: [prod-hub, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - name: Relay Deployment
        run: |
          cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            zookeeper:
              image: confluentinc/cp-zookeeper:7.5.0
              environment: { ZOOKEEPER_CLIENT_PORT: 2181 }
              networks: [infra_net]
            kafka:
              image: confluentinc/cp-kafka:7.5.0
              depends_on: [zookeeper]
              ports: ["9092:9092"]
              environment:
                KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${{ env.EVENTS_PRIVATE_IP }}:9092
              networks: [infra_net]
          networks:
            infra_net: { driver: bridge }
          EOF

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/events-compose.yml
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/deploy-key
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }} << 'BASTION_EOF'
            chmod 600 /home/ec2-user/deploy-key
            scp -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key /home/ec2-user/events-compose.yml ec2-user@${{ env.EVENTS_PRIVATE_IP }}:/home/ec2-user/docker-compose.yml
            ssh -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key ec2-user@${{ env.EVENTS_PRIVATE_IP }} "sudo docker compose up -d"
            rm /home/ec2-user/deploy-key /home/ec2-user/events-compose.yml
          BASTION_EOF

  deploy-state:
    name: Deploy Prod State (Relay)
    needs: [prod-hub, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - name: Relay Deployment
        run: |
          cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            redis:
              image: redis:7.2-alpine
              command: redis-server --appendonly yes --requirepass ${{ secrets.REDIS_PASSWORD }}
              ports: ["6379:6379"]
              volumes: ["/data/redis:/data"]
            grafana:
              image: grafana/grafana:latest
              environment: { GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }} }
              ports: ["3000:3000"]
              volumes: ["/data/grafana:/var/lib/grafana"]
          EOF

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/state-compose.yml
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/deploy-key
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }} << 'BASTION_EOF'
            chmod 600 /home/ec2-user/deploy-key
            scp -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key /home/ec2-user/state-compose.yml ec2-user@${{ env.STATE_PRIVATE_IP }}:/home/ec2-user/docker-compose.yml
            ssh -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key ec2-user@${{ env.STATE_PRIVATE_IP }} "sudo docker compose up -d"
            rm /home/ec2-user/deploy-key /home/ec2-user/state-compose.yml
          BASTION_EOF

  deploy-apps:
    name: Deploy Prod Services (Relay)
    needs: [deploy-events, deploy-state]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ip: 10.3.1.10
            node_name: node-a
          - ip: 10.4.1.10
            node_name: node-b
    steps:
      - name: Setup SSH
        run: mkdir -p ~/.ssh && echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - name: Relay Deployment
        run: |
          cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            frontend: { image: ${{ secrets.DOCKER_USERNAME }}/dermatech-frontend:latest, ports: ["80:80"], restart: always }
            api-gateway: { image: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest, ports: ["3000:3000"], restart: always, environment: { AUTH_SERVICE_URL: "http://auth-service:3000", PATIENT_SERVICE_URL: "http://patient-service:3000", APPOINTMENT_URL: "http://appointment-cmd:3000", AVAILABILITY_URL: "http://availability-qry:3000", PARTNERS_URL: "http://external-partners:3000", TRIAGE_URL: "http://triage-engine:3000", QR_URL: "http://qr-ingest:8080", AI_URL: "http://ai-agent:5000" } }
            auth-service: { image: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest, ports: ["3001:3000"], restart: always, environment: { KAFKA_BROKERS: "${{ env.EVENTS_PRIVATE_IP }}:9092", REDIS_HOST: "${{ env.STATE_PRIVATE_IP }}", DB_HOST: "${{ secrets.DATABASE_HOST }}", DB_PASS: "${{ secrets.DATABASE_PASSWORD }}", DB_NAME: "${{ secrets.DATABASE_NAME }}" } }
            patient-service: { image: ${{ secrets.DOCKER_USERNAME }}/patient-service:latest, ports: ["3002:3000"], restart: always, environment: { KAFKA_BROKERS: "${{ env.EVENTS_PRIVATE_IP }}:9092", DB_HOST: "${{ secrets.DATABASE_HOST }}", DB_PASS: "${{ secrets.DATABASE_PASSWORD }}" } }
            appointment-cmd: { image: ${{ secrets.DOCKER_USERNAME }}/appointment-cmd:latest, ports: ["3003:3000"], restart: always }
            availability-qry: { image: ${{ secrets.DOCKER_USERNAME }}/availability-qry:latest, ports: ["3004:3000"], restart: always }
            external-partners: { image: ${{ secrets.DOCKER_USERNAME }}/external-partners:latest, ports: ["3005:3000"], restart: always }
            qr-ingest: { image: ${{ secrets.DOCKER_USERNAME }}/qr-ingest:latest, ports: ["8080:8080"], restart: always }
            triage-engine: { image: ${{ secrets.DOCKER_USERNAME }}/triage-engine:latest, ports: ["3006:3000"], restart: always }
            ai-agent: { image: ${{ secrets.DOCKER_USERNAME }}/ai-agent:latest, ports: ["5000:5000"], restart: always }
          EOF

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/apps.yml
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/deploy-key
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }} << 'BASTION_EOF'
            chmod 600 /home/ec2-user/deploy-key
            scp -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key /home/ec2-user/apps.yml ec2-user@${{ matrix.ip }}:/home/ec2-user/docker-compose.yml
            ssh -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key ec2-user@${{ matrix.ip }} "
              echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
              sudo docker compose pull
              sudo docker compose up -d --remove-orphans
            "
            rm /home/ec2-user/deploy-key /home/ec2-user/apps.yml
          BASTION_EOF

      - name: Deployment Summary
        if: matrix.node_name == 'node-a'
        run: echo "::notice title=Prod Deployment::Applications successfully updated via Relay Strategy."

  load-testing:
    name:  PROD Smoke Test (Real Domain)
    needs: [deploy-apps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Execute k6 Load Test against PROD Domain
        uses: grafana/k6-action@v0.3.0
        env:
          API_URL: "https://martharodriguez_prod2.distribuidauce.org"
        with:
          filename: tests/load/smoke-test.js
          flags: --env API_URL="https://martharodriguez_prod2.distribuidauce.org"