name: "04. FRONTEND PROD (WEB DEPLOY)"

on:
  push:
    branches: [ main ] # Production typically monitors 'main'
    paths:
      - 'apps/clients/**'
  workflow_dispatch:

env:
  # Production Environment Constants
  PUBLIC_API_URL: "https://martharodriguez_prod2.distribuidauce.org"
  PROD_BASTION_PUBLIC_IP: 100.50.124.78

jobs:
  # ============================================================================
  # 1. CHANGE DETECTION LOGIC
  # Description: Optimization to avoid redundant builds if only backend changed.
  # ============================================================================
  check-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/clients/**'

  # ============================================================================
  # 2. WEB BUILD & DOCKERIZATION
  # Description: Compiles Flutter Web for Production and pushes to Docker Hub.
  # ============================================================================
  build-web:
    name: 🔨 Build & Push Web (PROD)
    needs: check-changes
    # Execution Condition: Runs only if frontend changes detected OR manual trigger
    if: needs.check-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # --- Environment Setup ---
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      
      # --- Build Process: Flutter Web Only ---
      - name: Build Flutter Web (PROD)
        run: |
          cd apps/clients/mobile_app
          flutter pub get
          flutter build web --release --dart-define=API_URL=${{ env.PUBLIC_API_URL }}

      # --- Docker Containerization ---
      - name: Docker Registry Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: 'apps/clients/mobile_app/Dockerfile'
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/dermatech-frontend:latest
          build-args: SERVICE_PATH='frontend'

  # ============================================================================
  # 3. DEPLOYMENT (RELAY VIA BASTION)
  # Description: Updates the running containers on Production Nodes via Jump Box.
  # ============================================================================
  deploy-frontend:
    name: 🚀 Deploy PROD Web Server
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ip: 10.3.1.10
            node_name: node-a
          - ip: 10.4.1.10
            node_name: node-b
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      
      - name: Generate Docker Compose Manifest
        run: |
          cat > docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            frontend:
              image: ${{ secrets.DOCKER_USERNAME }}/dermatech-frontend:latest
              restart: always
              ports: ["80:80"]
          EOF
          
      - name: Execute Deployment Relay
        run: |
          # 1. Transfer Payload to Bastion (Prod Jump Box)
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.yml ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/frontend.yml
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }}:/home/ec2-user/deploy-key
          
          # 2. Execute Remote Commands via Bastion
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ec2-user@${{ env.PROD_BASTION_PUBLIC_IP }} << 'BASTION_EOF'
            chmod 600 /home/ec2-user/deploy-key
            
            # 3. Jump to Private Node (Internal Network)
            scp -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key /home/ec2-user/frontend.yml ec2-user@${{ matrix.ip }}:/home/ec2-user/docker-compose.yml
            
            # 4. Pull and Restart Container
            ssh -o StrictHostKeyChecking=no -i /home/ec2-user/deploy-key ec2-user@${{ matrix.ip }} "
              echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
              sudo docker compose pull
              sudo docker compose up -d --remove-orphans
            "
            # 5. Security Cleanup
            rm /home/ec2-user/deploy-key /home/ec2-user/frontend.yml
          BASTION_EOF