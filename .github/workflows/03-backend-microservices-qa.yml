name: "03. BACKEND QA"

on:
  #push:
    #branches: [developer]
  workflow_dispatch:

env:
  QA_BASTION_PUBLIC_IP: 100.52.22.97
  EVENTS_PRIVATE_IP: 10.1.1.50
  STATE_PRIVATE_IP: 10.2.1.100

jobs:
  # ============================================================================
  # JOB 1: ANALYZE STATE (THE BRAIN)
  # ============================================================================
  analyze-state:
    name: 🧠 Analyze & Calculate Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      target_list: ${{ steps.set-matrix.outputs.target_list }}
      has_targets: ${{ steps.set-matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v3
        with: { fetch-depth: 0 }

      # --- 1. DETECT CODE CHANGES ---
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            auth-service: 'apps/services/core/auth-service/**'
            patient-service: 'apps/services/core/patient-service/**'
            api-gateway: 'apps/services/api-gateway/**'
            appointment-cmd: 'apps/services/scheduling/appointment-cmd/**'
            availability-qry: 'apps/services/scheduling/availability-qry/**'
            qr-ingest: 'apps/services/triage/qr-ingest/**'
            triage-engine: 'apps/services/triage/triage-engine/**'
            ai-agent: 'apps/services/ai-agent/**'

            # ⬇️ SERVICIOS COMENTADOS TEMPORALMENTE
            # external-partners: 'apps/services/support/external-partners/**'

      # --- 2. SETUP SSH ---
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Configurar SSH config para simplificar conexiones
          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${{ env.QA_BASTION_PUBLIC_IP }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 3
          
          Host node-a
            HostName 10.3.1.10
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 3
          
          Host node-b
            HostName 10.4.1.10
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      # --- 3. INSPECT NODES & CALCULATE MATRIX ---
      - name: 🕵️‍♂️ Inspect Nodes & Merge Lists
        id: set-matrix
        run: |
          set -e
          
          # Define Service Metadata (Name -> Path,Arg)
          declare -A CONFIG=(
            ["auth-service"]="apps/services/core/auth-service/Dockerfile,core/auth-service"
            ["patient-service"]="apps/services/core/patient-service/Dockerfile,core/patient-service"
            ["api-gateway"]="apps/services/api-gateway/Dockerfile,api-gateway"
            ["appointment-cmd"]="apps/services/scheduling/appointment-cmd/Dockerfile,scheduling/appointment-cmd"
            ["availability-qry"]="apps/services/scheduling/availability-qry/Dockerfile,scheduling/availability-qry"
            ["triage-engine"]="apps/services/triage/triage-engine/Dockerfile,triage/triage-engine"
            ["qr-ingest"]="apps/services/triage/qr-ingest/Dockerfile,triage/qr-ingest"
            ["ai-agent"]="apps/services/ai-agent/Dockerfile,ai-agent"
            
            # ⬇️ SERVICIOS COMENTADOS (No se generarán en la matriz)
            # ["external-partners"]="apps/services/support/external-partners/Dockerfile,support/external-partners"
          )

          # Lista restringida a SOLO los activos para evitar que detecte los otros como "Missing"
          ALL_SERVICES=("auth-service" "patient-service" "api-gateway" "appointment-cmd" "availability-qry" "qr-ingest" "triage-engine" "ai-agent")
          # ALL_SERVICES=("auth-service" "patient-service" "api-gateway" "appointment-cmd" "availability-qry" "external-partners" "triage-engine" "qr-ingest" "ai-agent")
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 STEP A: Detecting Code Changes"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # --- STEP A: Get Code Changes ---
          CHANGED_SERVICES=""
          if [[ "${{ steps.filter.outputs.auth-service }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES auth-service"; fi
          if [[ "${{ steps.filter.outputs.patient-service }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES patient-service"; fi
          if [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES api-gateway"; fi
          # if [[ "${{ steps.filter.outputs.appointment-cmd }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES appointment-cmd"; fi
          # if [[ "${{ steps.filter.outputs.availability-qry }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES availability-qry"; fi
          # if [[ "${{ steps.filter.outputs.external-partners }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES external-partners"; fi
          # if [[ "${{ steps.filter.outputs.triage-engine }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES triage-engine"; fi
          # if [[ "${{ steps.filter.outputs.qr-ingest }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES qr-ingest"; fi
          # if [[ "${{ steps.filter.outputs.ai-agent }}" == "true" ]]; then CHANGED_SERVICES="$CHANGED_SERVICES ai-agent"; fi
          
          echo "📝 Changed in Git: $CHANGED_SERVICES"

          # --- STEP B: Inspect Running Containers (SSH) ---
          # Comando para listar solo los servicios que nos interesan
          REMOTE_CMD='sudo docker ps --format "{{.Names}}" 2>/dev/null | grep -E "^(auth-service|patient-service|api-gateway|appointment-cmd)$" || true'
          
          echo "📡 Connecting to Nodes..."
          RUNNING_A=$(ssh -o ConnectTimeout=15 node-a "$REMOTE_CMD" 2>&1) || { echo "⚠️ Failed Node A"; RUNNING_A=""; }
          RUNNING_B=$(ssh -o ConnectTimeout=15 node-b "$REMOTE_CMD" 2>&1) || { echo "⚠️ Failed Node B"; RUNNING_B=""; }

          # --- STEP C: Calculate Missing Services ---
          MISSING_SERVICES=""
          for svc in "${ALL_SERVICES[@]}"; do
            IN_A=false; IN_B=false
            if echo "$RUNNING_A" | grep -q "^${svc}$"; then IN_A=true; fi
            if echo "$RUNNING_B" | grep -q "^${svc}$"; then IN_B=true; fi
            
            if [[ "$IN_A" == false ]] || [[ "$IN_B" == false ]]; then
              MISSING_SERVICES="$MISSING_SERVICES $svc"
            fi
          done
          echo "❌ Missing/Stopped Services: $MISSING_SERVICES"

          # --- STEP D: Merge Lists (Unique) ---
          TARGETS=$(echo "$CHANGED_SERVICES $MISSING_SERVICES" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          echo "🎯 FINAL TARGET LIST: $TARGETS"

          if [[ -z "$TARGETS" ]] || [[ "$TARGETS" == " " ]]; then
             echo "✅ No targets to deploy."
             echo "has_targets=false" >> $GITHUB_OUTPUT
             echo "matrix=[]" >> $GITHUB_OUTPUT
             exit 0
          fi

          # --- STEP E: Build JSON Matrix ---
          MATRIX_JSON="["
          FIRST=true
          for svc in $TARGETS; do
            svc=$(echo $svc | xargs)
            if [[ -n "$svc" ]]; then
                IFS=',' read -r dockerfile arg <<< "${CONFIG[$svc]}"
                if [ "$FIRST" = true ]; then FIRST=false; else MATRIX_JSON+=","; fi
                MATRIX_JSON+="{\"service\":\"$svc\",\"file\":\"$dockerfile\",\"arg\":\"$arg\"}"
            fi
          done
          MATRIX_JSON+="]"

          echo "has_targets=true" >> $GITHUB_OUTPUT
          echo "target_list=$TARGETS" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # ============================================================================
  # JOB 2: BUILD & PUSH (ONLY TARGETS)
  # ============================================================================
  docker-build:
    name: 🐳 Build & Push Targets
    needs: analyze-state
    if: needs.analyze-state.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.analyze-state.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: 18 }
      - run: npm ci --legacy-peer-deps
      - run: npx nx run-many --target=build --all --configuration=production --parallel=3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
          build-args: SERVICE_PATH=${{ matrix.arg }}

  # ============================================================================
  # JOB 3: SURGICAL DEPLOY (SCRIPT APPROACH)
  # ============================================================================
  deploy-surgical:
    name: 🚀 Surgical Deploy
    needs: [analyze-state, docker-build]
    if: needs.analyze-state.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ip: 10.3.1.10
            name: node-a
          - ip: 10.4.1.10
            name: node-b
    steps:
      - uses: actions/checkout@v3

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat > ~/.ssh/config << EOF
          Host bastion
            HostName ${{ env.QA_BASTION_PUBLIC_IP }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          
          Host target-node
            HostName ${{ matrix.ip }}
            User ec2-user
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Generate Compose File
        run: |
          cat > docker-compose.yml << EOF
          version: '3.8'
          services:
            api-gateway:
              image: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
              restart: always
              ports: ["3000:3000"]
              environment:
                - PORT=3000
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - AUTH_SERVICE_URL=http://auth-service:3000
                - PATIENT_SERVICE_URL=http://patient-service:3000
                - APPOINTMENT_URL=http://appointment-cmd:3000
                - AVAILABILITY_URL=http://availability-qry:3000
                - PARTNERS_URL=http://external-partners:3000
                - TRIAGE_URL=http://triage-engine:3000
                - QR_URL=http://qr-ingest:3000
                - AI_URL=http://ai-agent:3000
            auth-service:
              image: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
              restart: always
              ports: ["3001:3000"]
              environment:
                - PORT=3000
                - NODE_ENV=${{ secrets.NODE_ENV }}
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=${{ secrets.KAFKA_CLIENT_ID}}
                - KAFKA_GROUP_ID=${{ secrets.KAFKA_GROUP_ID }}
                - REDIS_HOST=${{ env.STATE_PRIVATE_IP }}
                - REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                - DATABASE_HOST=${{ secrets.DATABASE_HOST }}
                - DATABASE_USER=${{ secrets.DATABASE_USER }}
                - DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DATABASE_NAME=${{ secrets.DATABASE_NAME }}
                - DATABASE_PORT=${{ secrets.DATABASE_PORT }}
                - DATABASE_SYNC=${{ secrets.DATABASE_SYNC }}
                - JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
                - JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
                - JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            patient-service:
              image: ${{ secrets.DOCKER_USERNAME }}/patient-service:latest
              restart: always
              ports: ["3002:3000"]
              environment:
                - PORT=3000
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=patient-service              
                - KAFKA_GROUP_ID=patient-service-group
                - REDIS_HOST=${{ env.STATE_PRIVATE_IP }}
                - REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                - DB_HOST=${{ secrets.DATABASE_HOST }}
                - DB_USER=${{ secrets.DATABASE_USER }}
                - DB_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DB_NAME=${{ secrets.DATABASE_NAME }}
                - DB_PORT=${{ secrets.DATABASE_PORT }}
                - DB_SYNC=${{ secrets.DATABASE_SYNC }}
                - JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
                - JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
                - JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            appointment-cmd:
              image: ${{ secrets.DOCKER_USERNAME }}/appointment-cmd:latest
              restart: always
              ports: ["3003:3000"]
              environment:
                - PORT=3000
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=appointment-cmd              
                - KAFKA_GROUP_ID=appointment-service-group
                - REDIS_HOST=${{ env.STATE_PRIVATE_IP }}
                - REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - DB_HOST=${{ secrets.DATABASE_HOST }}
                - DB_USER=${{ secrets.DATABASE_USER }}
                - DB_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DB_NAME=${{ secrets.DATABASE_NAME }}
                - DB_PORT=${{ secrets.DATABASE_PORT }}
                - DB_SYNC=${{ secrets.DATABASE_SYNC }}

            availability-qry:
              image: ${{ secrets.DOCKER_USERNAME }}/availability-qry:latest
              restart: always
              ports: ["3004:3000"]
              environment:
                - PORT=3000
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=availability-qry-service
                - KAFKA_GROUP_ID=availability-service-group
                - REDIS_HOST=${{ env.STATE_PRIVATE_IP }}
                - REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
                - DB_HOST=${{ secrets.DATABASE_HOST }}
                - DB_USER=${{ secrets.DATABASE_USER }}
                - DB_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DB_NAME=${{ secrets.DATABASE_NAME }}
                - DB_PORT=${{ secrets.DATABASE_PORT }}
                - DB_SYNC=${{ secrets.DATABASE_SYNC }}

            external-partners:
              image: ${{ secrets.DOCKER_USERNAME }}/external-partners:latest
              restart: always
              ports: ["3005:3000"]
              environment:
                - PORT=3000
                - JWT_SECRET=${{ secrets.JWT_SECRET }}

            qr-ingest:
              image: ${{ secrets.DOCKER_USERNAME }}/qr-ingest:latest
              restart: always
              ports: ["3006:3000"]
              environment:
                - PORT=3000
                - JWT_SECRET=${{ secrets.JWT_SECRET }}

            triage-engine:
              image: ${{ secrets.DOCKER_USERNAME }}/triage-engine:latest
              restart: always
              ports: ["3007:3000"] 
              environment:
                - PORT=3000
                - QR_SERVICE_URL=http://qr-ingest:3000/generate
                - AI_SERVICE_URL=http://ai-agent:3000/analyze
                # KAFKA
                - KAFKA_BROKERS=${{ env.EVENTS_PRIVATE_IP }}:9092
                - KAFKA_CLIENT_ID=triage-engine-server
                - KAFKA_GROUP_ID=triage-engine-group
                - DB_HOST=${{ secrets.DATABASE_HOST }}
                - DB_USER=${{ secrets.DATABASE_USER }}
                - DB_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
                - DB_NAME=${{ secrets.DATABASE_NAME }}
                - DB_PORT=${{ secrets.DATABASE_PORT }}
                - DB_SYNC=${{ secrets.DATABASE_SYNC }}

            ai-agent:
              image: ${{ secrets.DOCKER_USERNAME }}/ai-agent:latest
              restart: always
              ports: ["3008:3000"] 
              environment:
                - PORT=3000
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF

      - name: Create Remote Deploy Script
        env:
          TARGETS: ${{ needs.analyze-state.outputs.target_list }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          cat > deploy-script.sh << 'SCRIPT_EOF'
          #!/bin/bash
          set -e
          DOCKER_USER="$1"
          DOCKER_PASS="$2"
          TARGETS="$3"

          echo '🔄 Starting deployment process...'
          
          # Login
          echo "$DOCKER_PASS" | sudo docker login -u "$DOCKER_USER" --password-stdin
          cd /home/ec2-user

          for service in $TARGETS; do
            service=$(echo "$service" | xargs)
            if [ -z "$service" ]; then continue; fi
            
            echo "------------------------------------------------"
            echo "📦 Processing: $service"
            
            # Pull
            sudo docker compose pull "$service"
            
            sudo docker compose up -d --force-recreate --no-deps "$service"
            
            # Fast Verification
            sleep 2
            if sudo docker ps | grep -q "$service"; then
               echo "✅ $service is running."
            else
               echo "⚠️  WARNING: $service might have crashed. Checking logs..."
               sudo docker logs "$service" --tail 10
            fi
          done

          echo "✅ Deployment completed on $(hostname)"
          
          echo "🧹 Cleaning up dangling images..."
          sudo docker image prune -f
          
          SCRIPT_EOF
          chmod +x deploy-script.sh

      - name: 🚀 Execute Deploy via Bastion
        env:
          TARGETS: ${{ needs.analyze-state.outputs.target_list }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Encode file Base64
          COMPOSE_B64=$(cat docker-compose.yml | base64 -w 0)
          SCRIPT_B64=$(cat deploy-script.sh | base64 -w 0)
          
          ssh target-node bash << EOF
            set -e
            
            # Decode files in the destine code
            echo '$COMPOSE_B64' | base64 -d > /home/ec2-user/docker-compose.yml
            echo '$SCRIPT_B64' | base64 -d > /home/ec2-user/deploy-script.sh
            chmod +x /home/ec2-user/deploy-script.sh
            
            # execute a deployment
            /home/ec2-user/deploy-script.sh "$DOCKER_USER" "$DOCKER_PASS" "$TARGETS"
            
            # Cleaning
            rm -f /home/ec2-user/deploy-script.sh
          EOF
          
          echo "✅ Deployment to ${{ matrix.name }} completed"