version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: infra_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - infra_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: infra_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # -----------------------------------------------------------------------
      # LA SOLUCIÓN MAESTRA:
      # 1. KAFKA_LISTENERS: "Escucho en todas mis tarjetas de red (0.0.0.0)"
      # 2. KAFKA_ADVERTISED_LISTENERS: "Dile a los clientes que me busquen en host.docker.internal"
      #    Esto hace que cuando tus Apps pregunten, Kafka les dé la dirección correcta.
      # -----------------------------------------------------------------------
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://host.docker.internal:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - infra_net

  redis:
    image: redis:alpine
    container_name: infra_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "password"
    networks:
      - infra_net

  # --- AGREGADO: MQTT MOSQUITTO ---
  mosquitto:
    image: eclipse-mosquitto
    container_name: infra_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - infra_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: infra_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - infra_net

  minio:
    image: minio/minio:latest
    container_name: infra_minio
    ports:
      - "9000:9000"
      - "9090:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - infra_net

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing myminio/dermatech-avatars;
      /usr/bin/mc anonymous set public myminio/dermatech-avatars;
      exit 0;
      "
    networks:
      - infra_net

  n8n:
    image: n8nio/n8n:latest
    container_name: infra_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - GENERIC_TIMEZONE=America/Guayaquil
      - TZ=America/Guayaquil
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - infra_net

networks:
  infra_net:
    driver: bridge

volumes:
  n8n_data: