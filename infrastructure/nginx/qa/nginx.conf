# /etc/nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==============================================================================
    # 1. SECURITY CONFIGURATION (WAF LITE)
    # ==============================================================================
    
    # Hide Nginx Version (Security by Obscurity)
    server_tokens off;

    # Rate Limiting Zone: Defines a memory zone "one" for storing IP addresses
    # Rule: 10 requests per second per IP allowed.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Log Format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ==============================================================================
    # 2. LOAD BALANCING UPSTREAMS (NODE A + NODE B)
    # Context: Active-Active Cluster. If Node A fails, traffic goes to Node B.
    # ==============================================================================

    # FRONTEND (Web App)
    upstream frontend_cluster {
        server 10.0.1.10:80;   # Node A (Container Port)
        server 10.0.1.20:80;   # Node B (Container Port)
    }

    # BACKEND: Auth Service
    upstream auth_service {
        server 10.0.1.10:3001; # Node A
        server 10.0.1.20:3001; # Node B
    }

    # BACKEND: Users Service
    upstream users_service {
        server 10.0.1.10:3002;
        server 10.0.1.20:3002;
    }

    # BACKEND: Appointments Service
    upstream appointments_service {
        server 10.0.1.10:3003;
        server 10.0.1.20:3003;
    }
    
    # ... AÑADE AQUI EL RESTO DE TUS MICROSERVICIOS ...

    # ==============================================================================
    # 3. SERVER BLOCK (The Gateway)
    # ==============================================================================
    server {
        listen 80;
        server_name _; # Responds to any IP/Domain mapped to this server

        # ----------------------------------------------------
        # GLOBAL CORS POLICY (Open for Dev/Thesis)
        # ----------------------------------------------------
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle Preflight requests (OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ----------------------------------------------------
        # ROUTE: FRONTEND
        # ----------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------
        # ROUTE: AUTH SERVICE
        # ----------------------------------------------------
        location /api/auth {
            # Apply Rate Limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Remove the "/api/auth" prefix before sending to NestJS?
            # DEPENDS: If NestJS has a global prefix 'api/auth', leave it.
            # If NestJS expects just '/', use rewrite.
            # Assuming NestJS controller has @Controller('auth'):
            rewrite ^/api/auth/(.*) /$1 break; 
            
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------------------
        # ROUTE: USERS SERVICE
        # ----------------------------------------------------
        location /api/users {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass http://users_service;
        }
        
        # ... REPITE ESTO PARA CADA MICROSERVICIO ...

        # ----------------------------------------------------
        # HEALTH CHECK
        # ----------------------------------------------------
        location /health {
            return 200 'Gateway is Alive';
        }
    }
}