version: '3.8'

# ==============================================================================
# DOCKER COMPOSE - MESSAGING & EVENT STREAMING LAYER
# Context: Deployed exclusively to the 'Events' EC2 Instance (Account 03).
# Purpose: Centralized backbone for asynchronous communication (Kafka, RabbitMQ, MQTT).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICE: ZOOKEEPER
  # Description: Coordination service for Kafka.
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dermatech_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: always
    networks:
      - event_network
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # SERVICE: KAFKA BROKER
  # Description: High-throughput event streaming (Event-Driven Architecture).
  # ----------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dermatech_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      
      # Network Configuration for AWS Access (Internal + Public IP)
      # ${KAFKA_PUBLIC_IP} must be set in the .env file on the server.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_PUBLIC_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Single-node configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    restart: always
    networks:
      - event_network

  # ----------------------------------------------------------------------------
  # SERVICE: RABBITMQ
  # Description: Message Broker for standard queuing (AMQP).
  # Used for tasks requiring complex routing or delayed queues.
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: dermatech_rabbitmq
    ports:
      - "5672:5672"   # AMQP Protocol (Services connect here)
      - "15672:15672" # Management UI (You access this via browser)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    restart: always
    networks:
      - event_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------------------
  # SERVICE: MOSQUITTO (MQTT)
  # Description: Lightweight broker for IoT devices/sensors.
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto
    container_name: dermatech_mqtt
    ports:
      - "1883:1883" # MQTT Protocol
      - "9001:9001" # Websockets
    volumes:
      # Ensure you upload the 'mosquitto/config' folder to the server
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: always
    networks:
      - event_network

# Persistent Volumes
volumes:
  mosquitto_data:
  mosquitto_log:

networks:
  event_network:
    driver: bridge