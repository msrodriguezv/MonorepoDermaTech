version: '3.8'

# ==============================================================================
# DOCKER COMPOSE - STATE & MONITORING LAYER
# Context: Deployed to 'State' EC2 Instance.
# ==============================================================================

services:
  redis:
    image: redis:alpine
    container_name: dermatech_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "admin123" 
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - state_network

  prometheus:
    image: prom/prometheus:latest
    container_name: dermatech_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: always
    networks:
      - state_network

  grafana:
    image: grafana/grafana:latest
    container_name: dermatech_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
    networks:
      - state_network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  state_network:
    driver: bridge