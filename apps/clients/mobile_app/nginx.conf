server {
    listen 80;
    server_name localhost;
    
    # Root directory where the static files are located
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # SPA (Single Page Application) Routing Strategy:
        # 1. Try to serve the requested file ($uri)
        # 2. Try to serve the directory ($uri/)
        # 3. Fallback to index.html (Vital for Flutter routing)
        try_files $uri $uri/ /index.html;
    }

    # Cache control for static assets (images, fonts, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}