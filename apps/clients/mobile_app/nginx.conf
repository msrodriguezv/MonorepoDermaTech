server {
    listen 80;
    server_name localhost;

    # Root directory for Flutter Web build
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # 1. COMPRESSION (Performance Optimization)
    # ==========================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon;

    # ==========================================================================
    # 2. SECURITY HEADERS
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ==========================================================================
    # 3. MAIN ROUTING (Flutter SPA)
    # ==========================================================================
    location / {
        # Redirect all unknown routes to index.html so Flutter handles the navigation
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # NOTE: The /api block has been removed. 
    # The AWS Load Balancer handles routing /api/* requests directly to the 
    # Backend Service (Port 3000). Nginx does not proxy API requests.
    # --------------------------------------------------------------------------

    # ==========================================================================
    # 4. CACHING STRATEGY
    # ==========================================================================
    
    # index.html: No Cache (Ensures users always get the latest version)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static Assets: Long Cache (1 Year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ==========================================================================
    # 5. HEALTH CHECK (Critical for AWS ALB)
    # ==========================================================================
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}