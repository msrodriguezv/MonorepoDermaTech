server {
    listen 80;
    server_name localhost;
    
    # Root directory for the compiled Flutter Web assets
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # COMPRESSION SETTINGS (PERFORMANCE)
    # ==============================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    # ==========================================================================
    # SECURITY HEADERS
    # ==============================================================================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ==========================================================================
    # ROUTING STRATEGY
    # ==============================================================================
    location / {
        # SPA (Single Page Application) Routing fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================================
    # API REVERSE PROXY (INTERNAL ROUTING)
    # Purpose: Bridges Port 80 (External) to Port 3000 (Internal API Gateway).
    # Resolves: CORS issues and avoids opening Port 3000 on the Security Group.
    # ==============================================================================
    location /api {
        # 'api-gateway' refers to the service name defined in docker-compose.yml
        proxy_pass http://api-gateway:3000;
        proxy_http_version 1.1;
        
        # Headers for WebSocket support and identity preservation
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Original client IP tracking
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # CACHING STRATEGY
    # ==============================================================================
    
    # 1. Index.html: NEVER CACHE (Ensures immediate updates)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 2. Static Assets (Images, JS, CSS, Fonts): LONG CACHE (1 Year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ==========================================================================
    # HEALTH CHECK (AWS ALB)
    # ==============================================================================
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}