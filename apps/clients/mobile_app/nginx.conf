server {
    listen 80;
    server_name localhost;
    
    # Root directory for the compiled Flutter Web assets
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # COMPRESSION SETTINGS (PERFORMANCE)
    # ==============================================================================
    gzip on;
    gzip_disable "msie6"; # Disable for old browsers

    # Compress data even if the client connects via a proxy (AWS ALB)
    gzip_proxied any;
    
    # Compression level (1-9). 6 is a good balance between CPU usage and size.
    gzip_comp_level 6;
    
    # Minimum file size to compress (in bytes). Don't compress tiny files.
    gzip_min_length 256;
    
    # MIME types to compress
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

    # ==========================================================================
    # SECURITY HEADERS
    # ==============================================================================
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN";
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff";
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block";

    # ==========================================================================
    # ROUTING STRATEGY
    # ==============================================================================
    location / {
        # SPA (Single Page Application) Routing:
        # 1. Try to serve the requested file ($uri)
        # 2. Try to serve the directory ($uri/)
        # 3. Fallback to index.html (Crucial for Flutter Navigator 2.0)
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================================
    # CACHING STRATEGY
    # ==============================================================================
    
    # 1. Index.html: NEVER CACHE.
    # This ensures users always get the latest version of the app immediately after deployment.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 2. Static Assets (Images, JS, CSS, Fonts): LONG CACHE.
    # Flutter generates unique hashes for filenames (e.g., main.hash.js), so we can safely cache these forever.
    # Added fonts extensions (woff, ttf, eot) which are essential for Flutter icons.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off; # Reduce log noise for static assets
    }

    # ==========================================================================
    # HEALTH CHECK (AWS ALB)
    # ==============================================================================
    # Lightweight endpoint for Load Balancers to verify container status
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}