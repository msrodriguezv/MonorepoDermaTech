version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: dermatech_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "admin123"
    volumes:
      - /data/redis:/data  # <--- PERSISTENCIA REAL (EBS)
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin123", "ping"]
      interval: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /data/prometheus:/etc/prometheus  # Guardar configs
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - /data/grafana:/var/lib/grafana  # Guardar dashboards
    depends_on:
      - prometheus
    restart: always